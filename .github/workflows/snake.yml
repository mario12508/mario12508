name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"   # запуск каждый день в полночь UTC
  workflow_dispatch:       # позволяет запустить вручную для теста

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write      # обязательно для пуша в ветку output

    steps:
      - name: Generate snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#ff00ff&color_dots=#ebedf0,#e6f4ea,#a8d5b5,#4caf50,#1b5e20
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00ffcc&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
